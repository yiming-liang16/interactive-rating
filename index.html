<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Interactive rating component</title>

  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="step1">
<div class="img"><div class="img-round"><img src="/icon-star.svg"></div></div>
<span class="title">How did we do?</span>
<span class="text">Please let us know how we did with your support request. All feedback is appreciated 
  to help us improve our offering!</span>
<div class="rating">
  <button class="ratingBtn">1</button>
  <button class="ratingBtn">2</button>
  <button class="ratingBtn">3</button>
  <button class="ratingBtn">4</button>
  <button class="ratingBtn">5</button>
</div>
<button type="submit" id="submitBtn">SUBMIT</button>
  </div>

<div id="step2" class="hidden">
<img src="/illustration-thank-you.svg">
<span id="resultText"></span>
<span>Thank you!</span>
<span>We appreciate you taking the time to give a rating. If you ever need more support, don't hesitate to get in touch!</span>
</div>
  

<script src="script.js"></script>
</body>
</html>
